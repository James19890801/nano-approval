<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>轻审批</title>
<style>
  :root { --primary:#4f46e5; --primary-grad:linear-gradient(135deg,#4f46e5 0%,#7c3aed 100%); --bg:#f4f5fa; --card:#fff; --text:#1a1d29; --muted:#6b7280; --danger:#e11d48; --ok:#059669; --line:#e8eaf2; }
  * { box-sizing:border-box; margin:0; padding:0; -webkit-tap-highlight-color:transparent; }
  body { font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Helvetica Neue",sans-serif; background:var(--bg); color:var(--text); }
  .page { max-width:520px; margin:0 auto; min-height:100vh; padding:16px 16px 80px; }
  .card { background:var(--card); border-radius:16px; padding:16px; margin-bottom:12px; box-shadow:0 1px 3px rgba(26,29,41,.05),0 4px 16px rgba(26,29,41,.04); border:1px solid var(--line); }
  h1 { font-size:22px; margin-bottom:16px; letter-spacing:-.02em; }
  .tabs { display:flex; background:var(--card); border-radius:14px; padding:4px; margin-bottom:12px; position:sticky; top:8px; z-index:5; box-shadow:0 2px 10px rgba(26,29,41,.08); border:1px solid var(--line); }
  .tab { flex:1; text-align:center; padding:10px 0; border-radius:10px; font-size:14px; color:var(--muted); cursor:pointer; font-weight:500; transition:.15s; }
  .tab.active { background:var(--primary-grad); color:#fff; font-weight:700; box-shadow:0 2px 8px rgba(79,70,229,.35); }
  .tab .redot { display:inline-block; width:8px; height:8px; border-radius:99px; background:#fb7185; margin-left:4px; vertical-align:2px; }
  .item { display:flex; justify-content:space-between; align-items:center; padding:14px 0; border-bottom:1px solid #f2f3f8; cursor:pointer; }
  .item:last-child { border-bottom:none; }
  .item:active { opacity:.7; }
  .item .title { font-weight:600; font-size:15px; }
  .item .sub { color:var(--muted); font-size:12.5px; margin-top:3px; }
  .badge { font-size:12px; padding:3px 10px; border-radius:99px; background:#eef0fe; color:var(--primary); font-weight:600; }
  .badge.doing { background:#fff1e6; color:#ea580c; }
  .badge.done { background:#ecfdf5; color:var(--ok); }
  .badge.reject { background:#fff1f2; color:var(--danger); }
  input,select,textarea { width:100%; padding:12px 14px; border:1.5px solid var(--line); border-radius:12px; font-size:16px; background:#fff; margin-top:5px; transition:border-color .15s; }
  input:focus,select:focus,textarea:focus { outline:none; border-color:var(--primary); }
  label.field { display:block; margin-bottom:14px; font-size:13.5px; color:var(--text); font-weight:500; }
  label.field .req { color:var(--danger); }
  button.btn { width:100%; padding:13px; border:none; border-radius:13px; font-size:16px; font-weight:700; background:var(--primary-grad); color:#fff; cursor:pointer; box-shadow:0 4px 12px rgba(79,70,229,.3); }
  button.btn:active { transform:translateY(1px); }
  button.btn.ghost { background:#fff; color:var(--primary); border:1.5px solid var(--primary); box-shadow:none; }
  button.btn.danger { background:var(--danger); box-shadow:0 4px 12px rgba(225,29,72,.25); }
  button.btn + button.btn { margin-top:10px; }
  .kv { display:flex; padding:10px 0; border-bottom:1px solid #f4f5fa; font-size:14px; }
  .kv .k { width:110px; color:var(--muted); flex-shrink:0; }
  .step { display:flex; gap:12px; padding:10px 0; }
  .step .dot { width:10px; height:10px; border-radius:99px; margin-top:6px; flex-shrink:0; background:#d7dae3; }
  .step.done .dot { background:var(--ok); }
  .step.doing .dot { background:#f59e0b; box-shadow:0 0 0 3px #fef3c7; }
  .step .body { flex:1; border-bottom:1px dashed #eceef4; padding-bottom:10px; }
  .step .name { font-weight:600; font-size:14px; }
  .step .meta { color:var(--muted); font-size:12px; margin-top:2px; }
  .step .comment { margin-top:6px; background:#f7f8fc; border-radius:10px; padding:9px 11px; font-size:13px; color:#3b3f51; white-space:pre-wrap; }
  .header { display:flex; justify-content:space-between; align-items:center; margin-bottom:14px; }
  .header h1 { margin:0; font-size:24px; background:var(--primary-grad); -webkit-background-clip:text; background-clip:text; color:transparent; }
  .header .who { color:var(--muted); font-size:13px; }
  .header a { color:var(--primary); text-decoration:none; font-size:13px; font-weight:600; }
  .empty { text-align:center; color:var(--muted); padding:44px 0; font-size:14px; }
  .back { display:inline-block; color:var(--primary); font-size:14px; margin-bottom:10px; cursor:pointer; text-decoration:none; font-weight:600; }
  textarea.config { font-family:ui-monospace,Menlo,monospace; font-size:12px; min-height:300px; }
  .toast { position:fixed; left:50%; transform:translateX(-50%); bottom:70px; background:rgba(26,29,41,.93); color:#fff; padding:10px 20px; border-radius:99px; font-size:14px; opacity:0; transition:opacity .25s; pointer-events:none; max-width:90vw; z-index:50; }
  .toast.show { opacity:1; }
  #backdrop { position:fixed; inset:0; background:rgba(15,17,26,.4); opacity:0; pointer-events:none; transition:opacity .25s; z-index:40; }
  #backdrop.show { opacity:1; pointer-events:auto; }
  #sidebar { position:fixed; top:0; right:0; bottom:0; width:min(92vw,380px); background:#fff; z-index:41; transform:translateX(100%); transition:transform .25s; padding:18px 16px 32px; overflow-y:auto; box-shadow:-8px 0 30px rgba(0,0,0,.15); }
  #sidebar.open { transform:none; }
  .step.agent-step { cursor:pointer; }
  .step.agent-step:hover .name { color:var(--primary); }
  .decision-badge { display:inline-block; font-size:12px; padding:1px 8px; border-radius:6px; margin-left:6px; }
  .decision-badge.pass { background:#ecfdf5; color:var(--ok); }
  .decision-badge.reject { background:#fff1f2; color:var(--danger); }
</style>
</head>
<body>
<div id="app" class="page"></div>
<div id="toast" class="toast"></div>
<script>
const $ = sel => document.querySelector(sel)
const app = $('#app')
let me = null

function toast(msg) {
  const t = $('#toast'); t.textContent = msg; t.classList.add('show')
  setTimeout(() => t.classList.remove('show'), 2600)
}
async function api(path, opts = {}) {
  const res = await fetch(path, { headers: { 'Content-Type': 'application/json' }, ...opts, body: opts.body ? JSON.stringify(opts.body) : undefined })
  const data = await res.json().catch(() => ({}))
  if (!res.ok) throw new Error(data.error || ('HTTP ' + res.status))
  return data
}
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))

// ── 登录页 ──
function renderLogin() {
  app.innerHTML = `
    <div style="padding-top:18vh">
      <h1 style="text-align:center">轻审批</h1>
      <p style="text-align:center;color:var(--muted);margin-bottom:28px">姓名 + 手机号，登录即注册</p>
      <div class="card">
        <label class="field">姓名<span class="req">*</span><input id="f_name" placeholder="张三"></label>
        <label class="field">手机号<span class="req">*</span><input id="f_phone" inputmode="numeric" maxlength="11" placeholder="13800000000"></label>
        <button class="btn" id="btn_login">进入</button>
      </div>
    </div>`
  $('#btn_login').onclick = async () => {
    try {
      me = await api('/api/login', { method: 'POST', body: { name: $('#f_name').value, phone: $('#f_phone').value } })
      location.hash = '#home'
    } catch (e) { toast(e.message) }
  }
}

// ── 首页（发起 / 待办 / 已办 / 我的）──
const TABS = [
  { key: 'start', label: '发起' },
  { key: 'todo', label: '待办' },
  { key: 'done', label: '已办' },
  { key: 'mine', label: '我的' },
]
let tab = 'start'

async function renderHome() {
  app.innerHTML = `
    <div class="header">
      <h1 style="margin:0">轻审批</h1>
      <div><span class="who">${esc(me.name)}</span> · <a href="javascript:void 0" id="lnk_tpl">管理</a> · <a href="javascript:void 0" id="lnk_out">退出</a></div>
    </div>
    <div class="tabs">${TABS.map(t => `<div class="tab ${t.key === tab ? 'active' : ''}" data-tab="${t.key}">${t.label}</div>`).join('')}</div>
    <div id="tab_body"><div class="empty">加载中…</div></div>`
  document.querySelectorAll('.tab').forEach(el => el.onclick = () => { tab = el.dataset.tab; renderHome() })
  $('#lnk_out').onclick = async () => { await api('/api/logout', { method: 'POST' }); me = null; renderLogin() }
  $('#lnk_tpl').onclick = () => { location.hash = '#manage' }
  try {
    const body = $('#tab_body')
    if (tab === 'start') {
      const list = await api('/api/templates')
      body.innerHTML = list.length ? `<div class="card">${list.map(t =>
        `<div class="item" data-id="${t.id}"><div><div class="title">${esc(t.display_name)}</div><div class="sub">${t.form.length} 个表单项</div></div><span class="badge">发起</span></div>`).join('')}</div>`
        : `<div class="empty">还没有模板，点右上角「配置」创建</div>`
      body.querySelectorAll('.item').forEach(el => el.onclick = () => { location.hash = '#apply/' + el.dataset.id })
    } else if (tab === 'todo') {
      const rows = await api('/api/todo')
      body.innerHTML = rows.length ? `<div class="card">${rows.map(r =>
        `<div class="item" data-id="${r.processInstanceId}"><div><div class="title">${esc(r.processDefineDisplayName || r.displayName)}</div><div class="sub">${esc(r.displayName)} · 发起人 ${esc(r.instanceVariable ? displayNameOf(r) : '')}</div></div><span class="badge doing">待审批</span></div>`).join('')}</div>`
        : `<div class="empty">没有待办，喝口水 🎉</div>`
      body.querySelectorAll('.item').forEach(el => el.onclick = () => { location.hash = '#detail/' + el.dataset.id })
    } else if (tab === 'done') {
      const rows = await api('/api/done')
      body.innerHTML = rows.length ? `<div class="card">${rows.map(r =>
        `<div class="item" data-id="${r.processInstanceId}"><div><div class="title">${esc(r.processDefineDisplayName || r.displayName)}</div><div class="sub">${esc(r.displayName)}</div></div><span class="badge done">已办</span></div>`).join('')}</div>`
        : `<div class="empty">暂无已办记录</div>`
      body.querySelectorAll('.item').forEach(el => el.onclick = () => { location.hash = '#detail/' + el.dataset.id })
    } else {
      const rows = await api('/api/my-instances')
      const stateText = { 10:'进行中', 20:'已通过', 30:'已撤回', 40:'已终止', 45:'已拒绝', 99:'已废弃' }
      const cls = s => s === 20 ? 'done' : s === 45 ? 'reject' : s === 10 ? 'doing' : ''
      body.innerHTML = rows.length ? `<div class="card">${rows.map(r =>
        `<div class="item" data-id="${r.id}"><div><div class="title">${esc(r.defineDisplayName || r.id)}</div><div class="sub">${fmtTime(r.createTime)}</div></div><span class="badge ${cls(r.state)}">${stateText[r.state] || r.state}</span></div>`).join('')}</div>`
        : `<div class="empty">还没有发起过申请</div>`
      body.querySelectorAll('.item').forEach(el => el.onclick = () => { location.hash = '#detail/' + el.dataset.id })
    }
  } catch (e) { $('#tab_body').innerHTML = `<div class="empty">${esc(e.message)}</div>` }
}
function displayNameOf(taskRow) {
  try { const v = JSON.parse(taskRow.instanceVariable || '{}'); return v.u_initiator_realName || v.u_realName || taskRow.operator || '' } catch { return taskRow.operator || '' }
}
function fmtTime(s) {
  if (!s) return ''
  const d = new Date(s)
  return isNaN(d) ? String(s) : `${d.getMonth() + 1}-${d.getDate()} ${String(d.getHours()).padStart(2, '0')}:${String(d.getMinutes()).padStart(2, '0')}`
}

// ── 发起申请（按模板 form 渲染动态表单）──
async function renderApply(templateId) {
  const tpl = await api('/api/templates/' + templateId)
  const fieldHtml = tpl.form.map(f => {
    if (f.type === 'select') {
      return `<label class="field">${esc(f.label)}${f.required ? '<span class="req">*</span>' : ''}<select id="v_${f.key}">
        <option value="">请选择</option>${(f.options || []).map(o => `<option value="${esc(o)}">${esc(o)}</option>`).join('')}</select></label>`
    }
    if (f.type === 'textarea') {
      return `<label class="field">${esc(f.label)}${f.required ? '<span class="req">*</span>' : ''}<textarea id="v_${f.key}" rows="3"></textarea></label>`
    }
    return `<label class="field">${esc(f.label)}${f.required ? '<span class="req">*</span>' : ''}<input id="v_${f.key}" type="${f.type === 'number' ? 'number' : 'text'}"></label>`
  }).join('')
  app.innerHTML = `
    <a class="back" href="javascript:history.back()">← 返回</a>
    <h1>${esc(tpl.display_name)}</h1>
    <div class="card">${fieldHtml || '<div class="empty">该模板没有表单项</div>'}</div>
    <button class="btn" id="btn_submit">提交申请</button>`
  $('#btn_submit').onclick = async () => {
    const values = {}
    tpl.form.forEach(f => { values[f.key] = $('#v_' + f.key).value })
    try {
      const { instanceId } = await api('/api/instances', { method: 'POST', body: { templateId, values } })
      toast('已提交')
      location.hash = '#detail/' + instanceId
    } catch (e) { toast(e.message) }
  }
}

// ── 实例详情 + 审批操作 ──
async function renderDetail(instanceId) {
  const d = await api('/api/instances/' + instanceId)
  const myTask = d.doing.find(t => (t.actorIds || []).includes(me.phone))
  const formValues = (d.form || []).map(f =>
    `<div class="kv"><span class="k">${esc(f.label)}</span><span>${esc(d.variables?.[f.key] ?? '—')}</span></div>`).join('')
  const steps = [...d.history, ...d.doing].map(t => {
    const isDone = t.taskState === 20
    const actorNames = t.actorNames || (t.actorIds || []).join('、') || t.operator
    const isAgentStep = Boolean(t.agent)
    const decisionBadge = t.decision ? `<span class="decision-badge ${t.decision}">${t.decision === 'pass' ? '判定:通过' : '判定:驳回'}</span>` : ''
    return `<div class="step ${isDone ? 'done' : 'doing'} ${isAgentStep ? 'agent-step' : ''}" ${isAgentStep ? `data-step="${esc(JSON.stringify({ agent: t.agent, comment: t.comment, decision: t.decision, displayName: t.displayName }))}"` : ''}>
      <div class="dot"></div>
      <div class="body">
        <div class="name">${esc(t.displayName || t.taskName)} · ${esc(actorNames)}${decisionBadge}${isAgentStep ? ' <span style="font-size:12px;color:var(--primary)">详情 ›</span>' : ''}</div>
        <div class="meta">${isDone ? '已完成 ' + fmtTime(t.finishTime) : '等待处理'}</div>
        ${t.comment ? `<div class="comment">${esc(t.comment.length > 80 ? t.comment.slice(0, 80) + '…' : t.comment)}</div>` : ''}
      </div></div>`
  }).join('')
  app.innerHTML = `
    <a class="back" href="#home">← 返回</a>
    <h1>${esc(d.id)} <span class="badge ${d.state === 20 ? 'done' : d.state === 45 ? 'reject' : 'doing'}">${d.stateText}</span></h1>
    <div class="card">${formValues}</div>
    <div class="card"><h3 style="font-size:15px;margin-bottom:8px">流程</h3>${steps}</div>
    ${myTask ? `<div class="card">
      <label class="field">审批意见<textarea id="f_comment" rows="2" placeholder="同意 / 不同意的原因"></textarea></label>
      <button class="btn" id="btn_agree">同意</button>
      <button class="btn danger" id="btn_reject">拒绝</button>
    </div>` : ''}
    <div id="backdrop"></div>
    <div id="sidebar"></div>`
  document.querySelectorAll('.agent-step').forEach(el => el.onclick = () => {
    const info = JSON.parse(el.dataset.step)
    openAgentSidebar(info)
  })
  if (myTask) {
    const act = async (path) => {
      try {
        await api(path, { method: 'POST', body: { comment: $('#f_comment').value } })
        toast('已处理')
        renderDetail(instanceId)
      } catch (e) { toast(e.message) }
    }
    $('#btn_agree').onclick = () => act(`/api/tasks/${myTask.id}/agree`)
    $('#btn_reject').onclick = () => act(`/api/tasks/${myTask.id}/reject`)
  }
}

// 智能体节点侧边栏
async function openAgentSidebar(info) {
  const sb = $('#sidebar'), bd = $('#backdrop')
  let meta = info.agent
  try {
    meta = await api('/api/agents/' + info.agent.id + '/view')
  } catch { /* 详情接口已带基础信息，失败就用现成的 */ }
  sb.innerHTML = `
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:14px">
      <h2 style="font-size:18px">智能体 · ${esc(meta.name)}</h2>
      <a href="javascript:void 0" id="sb_close" style="color:var(--muted);font-size:22px;line-height:1">×</a>
    </div>
    <div class="kv"><span class="k">模式</span><span>${meta.mode === 'auto' ? '自动审批' : '辅助'}</span></div>
    ${meta.description ? `<div class="kv"><span class="k">职责</span><span>${esc(meta.description)}</span></div>` : ''}
    ${meta.synced ? `<div class="kv"><span class="k">云端</span><span>已同步 QCA v${meta.qcaVersion}</span></div>` : `<div class="kv"><span class="k">云端</span><span>未同步</span></div>`}
    ${meta.skills?.length ? `<div class="kv"><span class="k">Skills</span><span>${meta.skills.map(esc).join('、')}</span></div>` : ''}
    ${info.decision ? `<div style="margin:14px 0 6px;font-weight:600;font-size:14px">本次判定 <span class="decision-badge ${info.decision}">${info.decision === 'pass' ? '通过' : '驳回'}</span></div>` : ''}
    <div style="margin:14px 0 6px;font-weight:600;font-size:14px">完整意见</div>
    <div class="comment" style="white-space:pre-wrap;margin-top:0">${esc(info.comment || '（暂无）')}</div>`
  sb.classList.add('open')
  bd.classList.add('show')
  $('#sb_close').onclick = closeSidebar
  bd.onclick = closeSidebar
}
function closeSidebar() {
  $('#sidebar').classList.remove('open')
  $('#backdrop').classList.remove('show')
}

// ── 管理界面：流程 / 实例 / 智能体 ──
let manageTab = 'agents'
const MANAGE_TABS = [
  { key: 'agents', label: '智能体' },
  { key: 'flows', label: '流程' },
  { key: 'instances', label: '实例' },
]

async function renderManage() {
  app.innerHTML = `
    <a class="back" href="#home">← 返回</a>
    <h1 style="margin-bottom:12px">管理</h1>
    <div class="tabs">${MANAGE_TABS.map(t => `<div class="tab ${t.key === manageTab ? 'active' : ''}" data-mtab="${t.key}">${t.label}</div>`).join('')}</div>
    <div id="m_body"><div class="empty">加载中…</div></div>`
  document.querySelectorAll('.tab[data-mtab]').forEach(el => el.onclick = () => { manageTab = el.dataset.mtab; renderManage() })
  const body = $('#m_body')
  try {
    if (manageTab === 'agents') await renderAgentsTab(body)
    else if (manageTab === 'flows') await renderFlowsTab(body)
    else await renderInstancesTab(body)
  } catch (e) { body.innerHTML = `<div class="empty">${esc(e.message)}</div>` }
}

async function renderAgentsTab(body) {
  const list = await api('/api/agents')
  body.innerHTML = `
    ${list.map(a => `
      <div class="card">
        <div style="display:flex;justify-content:space-between;align-items:center">
          <div><div class="title" style="font-weight:600">${esc(a.name)}</div>
          <div class="sub" style="color:var(--muted);font-size:13px">${esc(a.description || '')}</div></div>
          <span class="badge ${a.synced ? 'done' : ''}">${a.synced ? '已同步 v' + a.qcaVersion : '未同步'}</span>
        </div>
        ${a.syncNote ? `<div class="sub" style="font-size:12px;color:var(--muted);margin-top:6px">${esc(a.syncNote)}</div>` : ''}
        ${a.syncError ? `<div class="sub" style="font-size:12px;color:var(--danger);margin-top:6px">${esc(a.syncError)}</div>` : ''}
        <div style="display:flex;gap:8px;margin-top:10px">
          <button class="btn ghost" style="flex:1" data-edit="${a.id}">编辑</button>
          <button class="btn" style="flex:1" data-sync="${a.id}" data-name="${esc(a.name)}">同步到 QCA</button>
          <button class="btn danger" style="flex:0 0 64px" data-del="${a.id}">删除</button>
        </div>
      </div>`).join('') || '<div class="empty">还没有智能体，先新建一个</div>'}
    <div class="card">
      <h3 style="font-size:15px;margin-bottom:10px">新建 / 编辑智能体</h3>
      <label class="field">名称<input id="ag_name" placeholder="如：报销初审员"></label>
      <label class="field">职责描述<input id="ag_desc" placeholder="一句话职责，供一句话生成时匹配"></label>
      <label class="field">审批模式
        <select id="ag_mode">
          <option value="assist">辅助（只出意见，人审批）</option>
          <option value="auto">自动审批（按智能体判定自动通过/驳回）</option>
        </select>
      </label>
      <label class="field">系统提示词<textarea id="ag_prompt" rows="6" placeholder="你是……，负责……，输出……"></textarea></label>
      <div style="font-size:13px;font-weight:600;margin:6px 0 8px">工具（供 skill 调接口/查资料）</div>
      <div id="ag_tools" style="display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px">
        ${['WebFetch', 'WebSearch', 'Bash', 'Read', 'Write', 'Edit', 'Glob', 'Grep'].map(t =>
          `<label style="font-size:13px;background:#f3f4f6;border-radius:8px;padding:5px 10px"><input type="checkbox" value="${t}" style="width:auto;margin-right:4px">${t}</label>`).join('')}
      </div>
      <div style="font-size:13px;font-weight:600;margin:6px 0 8px">MCP 服务器（URL 型，name + url）</div>
      <div id="ag_mcp"></div>
      <button class="btn ghost" id="ag_add_mcp" style="margin:6px 0">＋ 添加 MCP</button>
      <div style="font-size:13px;font-weight:600;margin:6px 0 8px">Skills（Markdown 指令，同步时上传 QCA）</div>
      <div id="ag_skills"></div>
      <button class="btn ghost" id="ag_add_skill" style="margin:6px 0">＋ 添加 skill</button>
      <button class="btn" id="ag_save">保存</button>
      <input type="hidden" id="ag_id">
    </div>`
  const editingId = { v: null }
  const skillRow = (s = { title: '', content: '' }) => {
    const div = document.createElement('div')
    div.className = 'card'
    div.style.padding = '10px'
    div.innerHTML = `<label class="field" style="margin-bottom:6px">标题<input class="sk_title" value="${esc(s.title)}" placeholder="如：报销规范"></label>
      <label class="field" style="margin-bottom:0">内容<textarea class="sk_content" rows="3" placeholder="Markdown 指令">${esc(s.content)}</textarea></label>`
    return div
  }
  const mcpRow = (m = { name: '', url: '' }) => {
    const div = document.createElement('div')
    div.className = 'card'
    div.style.padding = '10px'
    div.innerHTML = `<label class="field" style="margin-bottom:6px">名称<input class="mcp_name" value="${esc(m.name)}" placeholder="如：天气查询"></label>
      <label class="field" style="margin-bottom:0">URL<input class="mcp_url" value="${esc(m.url)}" placeholder="https://mcp.example.com/mcp"></label>`
    return div
  }
  const loadEditor = (a) => {
    editingId.v = a?.id ?? null
    $('#ag_id').value = editingId.v ?? ''
    $('#ag_name').value = a?.name ?? ''
    $('#ag_desc').value = a?.description ?? ''
    $('#ag_mode').value = a?.mode ?? 'assist'
    $('#ag_prompt').value = a?.systemPrompt ?? ''
    document.querySelectorAll('#ag_tools input[type=checkbox]').forEach(c => { c.checked = (a?.tools ?? []).includes(c.value) })
    $('#ag_mcp').innerHTML = ''
    ;(a?.mcpServers ?? []).forEach(m => $('#ag_mcp').appendChild(mcpRow(m)))
    $('#ag_skills').innerHTML = ''
    ;(a?.skills ?? []).forEach(s => $('#ag_skills').appendChild(skillRow(s)))
  }
  body.querySelectorAll('[data-edit]').forEach(el => el.onclick = async () => loadEditor(await api('/api/agents/' + el.dataset.edit)))
  body.querySelectorAll('[data-sync]').forEach(el => el.onclick = async () => {
    el.textContent = '同步中…'; el.disabled = true
    try {
      const r = await api(`/api/agents/${el.dataset.sync}/sync`, { method: 'POST' })
      toast('已同步：' + (r.note || `v${r.qca_version}`))
      renderManage()
    } catch (e) { toast(e.message); el.textContent = '同步到 QCA'; el.disabled = false }
  })
  body.querySelectorAll('[data-del]').forEach(el => el.onclick = async () => {
    if (!confirm('删除该智能体？流程中引用它的节点将失效')) return
    await api(`/api/agents/${el.dataset.del}`, { method: 'DELETE' })
    toast('已删除'); renderManage()
  })
  $('#ag_add_skill').onclick = () => $('#ag_skills').appendChild(skillRow())
  $('#ag_add_mcp').onclick = () => $('#ag_mcp').appendChild(mcpRow())
  $('#ag_save').onclick = async () => {
    const skills = [...document.querySelectorAll('#ag_skills > .card')].map(d => ({
      title: d.querySelector('.sk_title').value.trim(),
      content: d.querySelector('.sk_content').value.trim(),
    })).filter(s => s.title && s.content)
    const tools = [...document.querySelectorAll('#ag_tools input[type=checkbox]:checked')].map(c => c.value)
    const mcpServers = [...document.querySelectorAll('#ag_mcp > .card')].map(d => ({
      name: d.querySelector('.mcp_name').value.trim(),
      url: d.querySelector('.mcp_url').value.trim(),
    })).filter(m => m.name && m.url)
    const payload = {
      name: $('#ag_name').value, description: $('#ag_desc').value,
      systemPrompt: $('#ag_prompt').value, skills, tools, mcpServers,
      mode: $('#ag_mode').value,
    }
    try {
      if (editingId.v) await api(`/api/agents/${editingId.v}`, { method: 'PUT', body: payload })
      else { const r = await api('/api/agents', { method: 'POST', body: payload }); editingId.v = r.id }
      toast('已保存，注意同步到 QCA 后才在流程中生效')
      renderManage()
    } catch (e) { toast(e.message) }
  }
  loadEditor(null)
}

async function renderFlowsTab(body) {
  const list = await api('/api/templates')
  body.innerHTML = `
    <div class="card" style="display:flex;gap:10px">
      <button class="btn" style="flex:1" onclick="location='/editor.html'">＋ 可视化新建流程（拖拽画布）</button>
    </div>
    <div class="card">${list.map(t =>
      `<div class="item"><div><div class="title">${esc(t.display_name)}${t.created_by === me.phone ? ' <span class="badge">我的</span>' : ''}</div><div class="sub">${esc(t.name)} · ${t.form.length} 个字段</div></div>
       <span style="display:flex;gap:8px"><span class="badge" style="cursor:pointer" data-edit="${t.id}">画布编辑</span></span></div>`).join('') || '<div class="empty">暂无模板</div>'}</div>`
  body.querySelectorAll('[data-edit]').forEach(el => el.onclick = () => { location = '/editor.html?tpl=' + el.dataset.edit })
}

async function renderInstancesTab(body) {
  const rows = await api('/api/instances')
  const stateText = { 10: '进行中', 20: '已通过', 30: '已撤回', 40: '已终止', 45: '已拒绝', 99: '已废弃' }
  const cls = s => s === 20 ? 'done' : s === 45 ? 'reject' : s === 10 ? 'doing' : ''
  body.innerHTML = rows.length ? `<div class="card">${rows.map(r =>
    `<div class="item" data-id="${r.id}"><div><div class="title">${esc(r.define_display_name || r.id)}</div><div class="sub">发起人 ${esc(r.operator)} · ${fmtTime(r.create_time)}</div></div><span class="badge ${cls(r.state)}">${stateText[r.state] || r.state}</span></div>`).join('')}</div>`
    : '<div class="empty">还没有实例</div>'
  body.querySelectorAll('.item').forEach(el => el.onclick = () => { location.hash = '#detail/' + el.dataset.id })
}

async function renderTemplates() {
  location.hash = '#manage'
  manageTab = 'flows'
  return renderManage()
}

// ── 路由 ──
async function route() {
  if (!me) {
    try { me = await api('/api/me') } catch { return renderLogin() }
  }
  const hash = (location.hash || '#home').replace(/^#/, '')
  const [page, param] = hash.split('/')
  if (page === 'apply' && param) return renderApply(param).catch(showErr)
  if (page === 'detail' && param) return renderDetail(param).catch(showErr)
  if (page === 'manage' || page === 'templates') return renderManage().catch(showErr)
  tab = 'start'; renderHome()
}
function showErr(e) { app.innerHTML = `<div class="empty">${esc(e.message)}</div>` }
window.addEventListener('hashchange', route)
route()
